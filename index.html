<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シン・俺表</title>
    <style>
        :root {
            --primary-color: #0a2f4e;
            --primary-color-light: #14507f;
            --accent-color: #ee9b00;
            --danger-color: #c1121f;
            --bg-color: #f2f4f7;
            --card-bg: #ffffff;
            --text-color: #232323;
            --text-muted: #6b7280;
            --border-color: #e2e5ea;

            --boat-1: #4a4a4a;
            --boat-2: #111111;
            --boat-3: #d90429;
            --boat-4: #0077b6;
            --boat-5: #d4a900;
            --boat-6: #2a9d3f;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0 0 40px;
            line-height: 1.55;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 14px;
        }
        header.app-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-color-light));
            color: #fff;
            padding: 22px 14px 26px;
            margin-bottom: -14px;
        }
        header.app-header .inner {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0;
            text-align: center;
            letter-spacing: 0.02em;
        }
        h1 .sub {
            display: block;
            font-size: 0.72rem;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 4px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(20, 30, 50, 0.06);
            border: 1px solid var(--border-color);
        }
        .control-card {
            margin-top: 18px;
        }
        .race-header-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 560px) {
            .race-header-grid { grid-template-columns: 1fr 1fr 1fr; }
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }
        .form-group select,
        .form-group input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            padding: 0 36px 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fff;
            color: var(--text-color);
            line-height: 44px;
        }
        .form-group select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%236b7280' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
        }
        .form-group input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
        }
        .btn-action {
            display: block;
            width: 100%;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            margin-top: 14px;
            transition: background 0.15s ease;
        }
        .btn-action:hover { background: var(--primary-color-light); }

        #boats-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        @media (min-width: 720px) {
            #boats-container { grid-template-columns: 1fr 1fr; }
        }

        .boat-card {
            border-top: 5px solid #ccc;
            padding-top: 14px;
        }
        .boat-1 { border-top-color: var(--boat-1); }
        .boat-2 { border-top-color: var(--boat-2); }
        .boat-3 { border-top-color: var(--boat-3); }
        .boat-4 { border-top-color: var(--boat-4); }
        .boat-5 { border-top-color: var(--boat-5); }
        .boat-6 { border-top-color: var(--boat-6); }

        .boat-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.02rem;
            margin-bottom: 12px;
        }
        .boat-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .boat-1 .boat-badge { background: var(--boat-1); }
        .boat-2 .boat-badge { background: var(--boat-2); }
        .boat-3 .boat-badge { background: var(--boat-3); }
        .boat-4 .boat-badge { background: var(--boat-4); }
        .boat-5 .boat-badge { background: var(--boat-5); color: #3a2e00; }
        .boat-6 .boat-badge { background: var(--boat-6); }

        .boat-name {
            flex: 1;
            white-space: normal;
            word-break: keep-all;
        }
        .class-chip {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--primary-color);
            background: #eef3f8;
            border-radius: 6px;
            padding: 2px 8px;
            flex-shrink: 0;
        }

        .evaluation-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            gap: 8px;
        }
        .evaluation-row > span {
            width: 52px;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .segmented {
            display: flex;
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .segmented label {
            flex: 1;
            text-align: center;
            padding: 7px 0;
            font-size: 0.85rem;
            cursor: pointer;
            background: #fafbfc;
            border-right: 1px solid var(--border-color);
            color: var(--text-muted);
            transition: background 0.15s ease, color 0.15s ease;
            user-select: none;
        }
        .segmented label:last-child { border-right: none; }
        .segmented input { display: none; }
        .segmented input:checked + label {
            background: var(--primary-color);
            color: #fff;
            font-weight: 700;
        }

        /* オリ展 手入力エリア */
        .oriten-block {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .oriten-block-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
        }
        .oriten-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .oriten-field {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        .oriten-field label {
            color: var(--text-muted);
            width: 48px;
            flex-shrink: 0;
        }
        .oriten-field input[type="number"] {
            width: 100%;
            height: 32px;
            padding: 0 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.82rem;
            text-align: right;
            -webkit-appearance: none;
            appearance: none;
        }

        .hinao-check {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--danger-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .memo-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 6px;
        }
        .btn-submit {
            display: block;
            width: 100%;
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            margin-top: 18px;
        }
        .btn-submit:hover { background: #d48800; }

        .result-box {
            background: #eaf3fb;
            border: 1px solid #c9e2f2;
            border-radius: 12px;
            padding: 16px;
            margin-top: 18px;
            display: none;
        }
        .result-box h2 { font-size: 1.05rem; color: var(--primary-color); margin-top: 0; }
        .result-box table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
        .result-box th, .result-box td { padding: 5px 6px; border-bottom: 1px solid #d6e6f2; text-align: left; }
        .result-box th { color: var(--text-muted); font-weight: 600; }
        .combo-line { font-family: -apple-system, monospace; font-size: 0.9rem; padding: 2px 0; }
        .score-table-wrap { overflow-x: auto; }
        .review-note { color: var(--text-muted); font-size: 0.82rem; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="inner">
        <h1>🚤 シン・俺表
            <span class="sub">ボートレース 24場対応 俺の採点 ＆ 展開予想</span>
        </h1>
    </div>
</header>

<div class="container">
    <div class="card control-card">
        <div class="race-header-grid">
            <div class="form-group">
                <label>開催日</label>
                <input type="date" id="race-date">
            </div>
            <div class="form-group">
                <label>レース場 (全24場)</label>
                <select id="stadium">
                    <optgroup label="関東地区">
                        <option value="01">01 桐生</option>
                        <option value="02">02 戸田</option>
                        <option value="03">03 江戸川</option>
                        <option value="04">04 平和島</option>
                        <option value="05" selected>05 多摩川</option>
                    </optgroup>
                    <optgroup label="東海地区">
                        <option value="06">06 浜名湖</option>
                        <option value="07">07 蒲郡</option>
                        <option value="08">08 常滑</option>
                        <option value="09">09 津</option>
                    </optgroup>
                    <optgroup label="近畿地区">
                        <option value="10">10 三国</option>
                        <option value="11">11 びわこ</option>
                        <option value="12">12 住之江</option>
                        <option value="13">13 尼崎</option>
                    </optgroup>
                    <optgroup label="四国地区">
                        <option value="14">14 鳴門</option>
                        <option value="15">15 丸亀</option>
                    </optgroup>
                    <optgroup label="中国地区">
                        <option value="16">16 児島</option>
                        <option value="17">17 宮島</option>
                        <option value="18">18 徳山</option>
                        <option value="19">19 下関</option>
                    </optgroup>
                    <optgroup label="九州地区">
                        <option value="20">20 若松</option>
                        <option value="21">21 芦屋</option>
                        <option value="22">22 福岡</option>
                        <option value="23">23 唐津</option>
                        <option value="24">24 大村</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label>レース番号</label>
                <select id="race-no">
                    <script>
                        for(let i=1; i<=12; i++) {
                            document.write(`<option value="${i}" ${i===3?'selected':''}>第${i}R</option>`);
                        }
                    </script>
                </select>
            </div>
        </div>
        <button class="btn-action" onclick="loadRaceData()">🔄 この条件でレースデータを読み込む</button>
    </div>

    <div id="boats-container"></div>

    <button class="btn-submit" onclick="generatePrediction()">🤖 AIに展開予想と買い目を作らせる</button>

    <div class="result-box" id="result-area">
        <h2 id="result-title">🧠 展開シナリオ ＆ 推奨買い目</h2>
        <div id="result-content"></div>
    </div>
</div>

<script>
    let currentRaceData = null;

    // 評価項目の定義（腕・オリ展を追加）
    const EVAL_ITEMS = [
        { key: 'ude',    label: '腕',     defaultVal: 3 },
        { key: 'st',     label: 'St',     defaultVal: 3 },
        { key: 'm2',     label: '2M',     defaultVal: 3 },
        { key: 'm1a',    label: '1M①',    defaultVal: 3 },
        { key: 'm1b',    label: '1M②',    defaultVal: 3 },
        { key: 'oriten', label: 'オリ展', defaultVal: 3 }
    ];

    const COURSE_BASE_SCORES = { 1: 55, 2: 14, 3: 12, 4: 10, 5: 6, 6: 3 };

    function cleanName(name) {
        return (name || '').replace(/\s+/g, ' ').trim();
    }

    document.getElementById('race-date').valueAsDate = new Date();
    loadRaceData();

    async function loadRaceData() {
        const dateVal = document.getElementById('race-date').value.replace(/-/g, '');
        const stadiumVal = document.getElementById('stadium').value;
        const jsonUrl = `data/${dateVal}_${stadiumVal}.json`;

        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) {
                throw new Error(`HTTPエラー: ${response.status} (${jsonUrl} が見つかりません)`);
            }
            currentRaceData = await response.json();
            renderBoats();
            showNotice(`データを正常に読み込みました (${dateVal} 場コード:${stadiumVal})`);
        } catch (error) {
            console.error("JSONの読み込みに失敗しました:", error);
            showNotice(`⚠️ データの取得に失敗しました: ${error.message}。<br>GitHub Actionsでデータが生成されているか確認してください。`, true);

            currentRaceData = {
                races: Array.from({length: 12}, (_, i) => ({
                    race_no: i + 1,
                    racers: Array.from({length: 6}, (_, j) => ({
                        no: j + 1,
                        name: `選手${j+1}号艇 (データ未取得)`,
                        class: "A1"
                    }))
                }))
            };
            renderBoats();
        }
    }

    function radioGroup(name, boatNo, selected) {
        return [1,2,3,4,5].map(v =>
            `<input type="radio" id="${name}_${boatNo}_${v}" name="${name}_${boatNo}" value="${v}" ${v===selected?'checked':''}>
             <label for="${name}_${boatNo}_${v}">${v}</label>`
        ).join('');
    }

    function renderBoats() {
        const raceNo = parseInt(document.getElementById('race-no').value);
        const container = document.getElementById('boats-container');
        container.innerHTML = '';

        if (!currentRaceData || !currentRaceData.races) return;

        const raceInfo = currentRaceData.races.find(r => r.race_no === raceNo) || currentRaceData.races[0];

        raceInfo.racers.forEach(racer => {
            const displayName = cleanName(racer.name);
            const card = document.createElement('div');
            card.className = `card boat-card boat-${racer.no}`;

            const evalRowsHtml = EVAL_ITEMS.map(item => `
                <div class="evaluation-row">
                    <span>${item.label}</span>
                    <div class="segmented">${radioGroup(item.key, racer.no, item.defaultVal)}</div>
                </div>
            `).join('');

            // オリ展（中継画面タイム）手入力ブロック
            const oritenBlockHtml = `
                <div class="oriten-block">
                    <div class="oriten-block-title">📺 オリジナル展示タイム（手入力）</div>
                    <div class="oriten-grid">
                        <div class="oriten-field">
                            <label>一周</label>
                            <input type="number" step="0.01" id="one_lap_${racer.no}" placeholder="36.80">
                        </div>
                        <div class="oriten-field">
                            <label>まわり足</label>
                            <input type="number" step="0.01" id="turn_${racer.no}" placeholder="11.50">
                        </div>
                        <div class="oriten-field">
                            <label>直線</label>
                            <input type="number" step="0.01" id="straight_${racer.no}" placeholder="6.80">
                        </div>
                        <div class="oriten-field">
                            <label>半周</label>
                            <input type="number" step="0.01" id="half_lap_${racer.no}" placeholder="18.20">
                        </div>
                    </div>
                </div>
            `;

            card.innerHTML = `
                <div class="boat-title">
                    <span class="boat-badge">${racer.no}</span>
                    <span class="boat-name">${displayName}</span>
                    <span class="class-chip">${racer.class}</span>
                </div>
                ${evalRowsHtml}
                ${oritenBlockHtml}
                <label class="hinao-check">
                    <input type="radio" name="hinao_target" value="${racer.no}"> 🎯 このレースの穴狙い軸に指定（6艇中1艇のみ）
                </label>
                <input type="text" class="memo-input" placeholder="例: 出足良し、伸びるけど差されそう、カドから一気など" id="memo_${racer.no}">
            `;
            container.appendChild(card);
        });
        restorePredictionDraft(raceInfo);
    }

    function showNotice(htmlMessage, isError = false) {
        const resultArea = document.getElementById('result-area');
        const title = document.getElementById('result-title');
        title.innerText = isError ? "⚠️ 読み込みエラー通知" : "📢 システム通知";
        resultArea.querySelector('#result-content').innerHTML = htmlMessage;
        resultArea.style.display = 'block';
    }

    function finiteNumber(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
    }

    // M3再設計スコア算定（ユーザー主観 65% : 公式データ 35%）
    function collectBoatScores(raceInfo) {
        return raceInfo.racers.map(racer => {
            const scores = {};
            let userSum = 0;
            EVAL_ITEMS.forEach(item => {
                const checked = document.querySelector(`input[name="${item.key}_${racer.no}"]:checked`);
                const val = checked ? parseInt(checked.value, 10) : item.defaultVal;
                scores[item.key] = val;
                userSum += val;
            });

            // ユーザー主観評価（6項目 × 1〜5pt ＝ 6〜30pt） -> 100点満点スケールに換算 (重量 65%)
            const userScaled = ((userSum - 6) / 24) * 100;

            // 公式データスコア (重量 35%)
            const course = finiteNumber(racer.preview?.start_exhibition?.course) ?? racer.no;
            const courseVal = COURSE_BASE_SCORES[course] ?? 5;
            const motorVal = finiteNumber(racer.motor?.top2_rate) ?? 30;
            const localVal = finiteNumber(racer.local?.win_rate) ? finiteNumber(racer.local.win_rate) * 12.5 : 40;
            const nationalVal = finiteNumber(racer.national?.win_rate) ? finiteNumber(racer.national.win_rate) * 12.5 : 40;
            const officialScore = (courseVal * 0.4) + (motorVal * 0.3) + (localVal * 0.15) + (nationalVal * 0.15);

            // フライング減点
            const isFlying = racer.flying === true || racer.preview?.start_exhibition?.flying === true;
            const flyingPenalty = isFlying ? 30 : 0;

            // 最終合成スコア = ユーザー主観 65% + 公式データ 35% - 減点
            const finalScore = Math.max(0, (userScaled * 0.65 + officialScore * 0.35) - flyingPenalty);

            // オリ展の手入力タイムの取得
            const oritenTimes = {
                one_lap: document.getElementById(`one_lap_${racer.no}`)?.value || null,
                turn: document.getElementById(`turn_${racer.no}`)?.value || null,
                straight: document.getElementById(`straight_${racer.no}`)?.value || null,
                half_lap: document.getElementById(`half_lap_${racer.no}`)?.value || null
            };

            const memoEl = document.getElementById(`memo_${racer.no}`);

            return {
                no: racer.no,
                name: cleanName(racer.name),
                cls: racer.class,
                scores,
                userSum,
                userScaled,
                officialScore,
                finalScore,
                flyingPenalty,
                oritenTimes,
                memo: memoEl ? memoEl.value.trim() : ''
            };
        });
    }

    function buildScenarioText(ranked, axis, hinaoNo, boats) {
        let text = `ユーザー観点を中心とした総合評価1位は <strong>${axis.no}号艇 ${axis.name}</strong>（最終合成: ${axis.finalScore.toFixed(1)}pt）。`;
        if (axis.flyingPenalty) {
            text += `<br><strong>⚠️ 注意:</strong> フライング情報により${axis.flyingPenalty}pt減点されています。`;
        }
        if (hinaoNo) {
            const hinaoBoat = boats.find(b => b.no === hinaoNo);
            text += `<br>🎯 穴狙い指定: <strong>${hinaoNo}号艇 ${hinaoBoat.name}</strong>（最終${hinaoBoat.finalScore.toFixed(1)}pt）。`;
        }
        return text;
    }

    function buildBuyCombos(ranked, axis, hinaoNo) {
        const top3 = ranked.slice(0, 3);
        const honmei = [];
        top3.forEach(second => {
            if (second.no === axis.no) return;
            top3.forEach(third => {
                if (third.no === axis.no || third.no === second.no) return;
                honmei.push(`${axis.no} → ${second.no} → ${third.no}`);
            });
        });

        const ana = [];
        if (hinaoNo && hinaoNo !== axis.no) {
            const others = ranked.filter(b => b.no !== axis.no && b.no !== hinaoNo).slice(0, 2);
            others.forEach(o => {
                ana.push(`${axis.no} → ${hinaoNo} → ${o.no}`);
                ana.push(`${hinaoNo} → ${axis.no} → ${o.no}`);
            });
        }
        return { honmei, ana };
    }

    function buildScoreTable(ranked) {
        let html = '<table><tr><th>艇</th><th>腕</th><th>St</th><th>2M</th><th>1M①</th><th>1M②</th><th>オリ展</th><th>主観計</th><th>公式データ</th><th>最終スコア</th></tr>';
        ranked.forEach(b => {
            html += `<tr><td>${b.no} ${b.name}</td><td>${b.scores.ude}</td><td>${b.scores.st}</td><td>${b.scores.m2}</td><td>${b.scores.m1a}</td><td>${b.scores.m1b}</td><td>${b.scores.oriten}</td><td>${b.userSum}</td><td>${b.officialScore.toFixed(1)}</td><td><strong>${b.finalScore.toFixed(1)}</strong></td></tr>`;
        });
        html += '</table>';
        return `<div class="score-table-wrap">${html}</div>`;
    }

    function raceStorageKey(raceInfo) {
        const date = currentRaceData?.date || document.getElementById('race-date').value.replace(/-/g, '');
        const stadium = currentRaceData?.stadium_code || document.getElementById('stadium').value;
        return `shin-orehyo:prediction:${date}:${stadium}:${raceInfo.race_no}`;
    }

    function savePredictionDraft(raceInfo, boats, hinaoNo) {
        const predictions = boats.map(boat => ({
            boat_no: boat.no,
            scores: boat.scores,
            oriten_times: boat.oritenTimes,
            hinao: boat.no === hinaoNo,
            memo: boat.memo,
            final_score: Number(boat.finalScore.toFixed(1))
        }));
        try {
            localStorage.setItem(raceStorageKey(raceInfo), JSON.stringify({ predictions, saved_at: new Date().toISOString() }));
        } catch (error) {
            console.warn('予想のローカル保存に失敗しました:', error);
        }
    }

    function restorePredictionDraft(raceInfo) {
        try {
            const saved = JSON.parse(localStorage.getItem(raceStorageKey(raceInfo)) || 'null');
            if (!saved?.predictions) return;
            saved.predictions.forEach(prediction => {
                Object.entries(prediction.scores || {}).forEach(([key, value]) => {
                    const input = document.querySelector(`input[name="${key}_${prediction.boat_no}"][value="${value}"]`);
                    if (input) input.checked = true;
                });
                if (prediction.oriten_times) {
                    ['one_lap', 'turn', 'straight', 'half_lap'].forEach(tKey => {
                        const el = document.getElementById(`${tKey}_${prediction.boat_no}`);
                        if (el && prediction.oriten_times[tKey]) el.value = prediction.oriten_times[tKey];
                    });
                }
                const memo = document.getElementById(`memo_${prediction.boat_no}`);
                if (memo) memo.value = prediction.memo || '';
                if (prediction.hinao) {
                    const hinao = document.querySelector(`input[name="hinao_target"][value="${prediction.boat_no}"]`);
                    if (hinao) hinao.checked = true;
                }
            });
        } catch (error) {
            console.warn('保存済み予想の復元に失敗しました:', error);
        }
    }

    function generatePrediction() {
        if (!currentRaceData || !currentRaceData.races) {
            showNotice('⚠️ レースデータが読み込まれていません。先に「この条件でレースデータを読み込む」を押してください。', true);
            return;
        }

        const stadiumSelect = document.getElementById('stadium');
        const stadiumName = stadiumSelect.options[stadiumSelect.selectedIndex].text;
        const raceNo = parseInt(document.getElementById('race-no').value);
        const raceInfo = currentRaceData.races.find(r => r.race_no === raceNo) || currentRaceData.races[0];

        const selectedHinao = document.querySelector('input[name="hinao_target"]:checked');
        const hinaoNo = selectedHinao ? parseInt(selectedHinao.value, 10) : null;

        const boats = collectBoatScores(raceInfo);
        const ranked = [...boats].sort((a, b) => b.finalScore - a.finalScore || a.no - b.no);
        const axis = ranked[0];

        const scenarioText = buildScenarioText(ranked, axis, hinaoNo, boats);
        const { honmei, ana } = buildBuyCombos(ranked, axis, hinaoNo);
        const scoreTableHtml = buildScoreTable(ranked);
        savePredictionDraft(raceInfo, boats, hinaoNo);

        let html = `<p><strong>【選択レース】</strong> ${stadiumName} 第${raceNo}R</p>`;
        html += `<p>${scenarioText}</p>`;
        html += `<hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;

        html += `<p><strong>💡 推奨買い目（3連単）</strong></p>`;
        html += `<p style="color:var(--primary-color); font-weight:600; margin-bottom:4px;">本線</p>`;
        html += honmei.map(c => `<div class="combo-line">${c}</div>`).join('');

        if (ana.length) {
            html += `<p style="color:var(--danger-color); font-weight:600; margin:10px 0 4px;">穴狙い</p>`;
            html += ana.map(c => `<div class="combo-line">${c}</div>`).join('');
        }

        html += `<hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;
        html += `<p><strong>採点一覧</strong></p>${scoreTableHtml}`;

        document.getElementById('result-title').innerText = "🧠 展開シナリオ ＆ 推奨買い目";
        const resultArea = document.getElementById('result-area');
        resultArea.querySelector('#result-content').innerHTML = html;
        resultArea.style.display = 'block';
        resultArea.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
