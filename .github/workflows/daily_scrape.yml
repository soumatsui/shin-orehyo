name: Daily Boat Data Scraper

on:
  schedule:
    # 毎日 日本時間 0:00 (UTC 15:00) に自動実行
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動でも実行できるようにする

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          pip install beautifulsoup4 requests

      - name: データ取得スクリプトの実行
        run: |
          python fetch_boat_data.py

      - name: 変更されたデータを自動コミット ＆ プッシュ
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update boat race data for today" && git push)
